{# Move one open application. Pass show_note for the note box, next to return there. #}
<form method="post" action="{% url 'careers:move' application.pk %}"
      hx-post="{% url 'careers:move' application.pk %}" hx-swap="outerHTML"
      class="flex flex-wrap items-center gap-2">
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
  {% if on_board %}<input type="hidden" name="board" value="1" />{% endif %}
  <select name="stage" aria-label="Move to" required class="select select-sm w-auto">
    <option value="" selected disabled>Move to…</option>
    {% for stage in stages %}
      {% if stage.pk != application.stage_id %}
        <option value="{{ stage.pk }}">{{ stage.name }}</option>
      {% endif %}
    {% endfor %}
  </select>
  {% if show_note %}
    <input type="text" name="note" aria-label="Note" placeholder="Note (optional)" class="input input-sm w-auto" />
  {% endif %}
  <button type="submit" class="btn btn-primary btn-sm">Move</button>
</form>
