{% extends "base.html" %}

{% block title %}Rename {{ wishlist.name }} — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="card mx-auto max-w-sm bg-base-100 shadow-md">
    <div class="card-body">
      <h1 class="card-title text-2xl">Rename &ldquo;{{ wishlist.name }}&rdquo;</h1>
      <form method="post" class="mt-4 space-y-4">
        {% csrf_token %}
        {% include "wishlists/partials/_name_field.html" %}
        <div class="flex justify-end gap-2">
          <a href="{% url 'wishlists:index' %}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Rename</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
